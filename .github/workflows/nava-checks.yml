name: Nava checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app.py
      - run: cd backend && python -m unittest test_education_sso -v
